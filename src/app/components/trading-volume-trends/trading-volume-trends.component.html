<mat-card class="!p-4 !bg-white ">
   
    <div class="flex place-content-between">
        <h2 class="text-lg font-bold mb-4">Trading Volume Trends</h2>           
        <div class="flex gap-2">                        
            <mat-icon class="cursor-pointer" mat-fab extended color="primary" (click)="updateChart()">search</mat-icon>    
            
            <mat-icon class="cursor-pointer" mat-fab extended color="primary" (click)="showBothCryptos()">compare</mat-icon>              
        </div>
    </div>

    <div class="w-full h-80 mb-6">
        <canvas #chartCanvas></canvas>
    </div>

        <div class="flex gap-4 mb-0">           
                
                <mat-form-field class="">
                    <mat-label>Start Date</mat-label>
                    <input matInput [matDatepicker]="pickerStart" [(ngModel)]="startDate">
                    <mat-datepicker-toggle matSuffix [for]="pickerStart"></mat-datepicker-toggle>
                    <mat-datepicker #pickerStart></mat-datepicker>
                </mat-form-field>
        
                <mat-form-field class="">
                    <mat-label>End Date</mat-label>
                    <input matInput [matDatepicker]="pickerEnd" [(ngModel)]="endDate">
                    <mat-datepicker-toggle matSuffix [for]="pickerEnd"></mat-datepicker-toggle>
                    <mat-datepicker #pickerEnd></mat-datepicker>
                </mat-form-field>            
        </div>

</mat-card>
